<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Paypal - Secure Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
    }
    h2 { color: #003087; margin-bottom: 20px; }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 12px;
      width: 95%;
      padding: 12px;
      background: #0070ba;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    p { font-size: 12px; color: #999; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🔵 PayPal Login</h2>
    <input type="email" placeholder="Email address" name="email" /><br/>
    <input type="password" placeholder="Password" name="password" /><br/>
    <button>Log In</button>
    <p>This is a fake test page for the Phishing Detector extension demo.</p>
  </div>
</body>
</html>
